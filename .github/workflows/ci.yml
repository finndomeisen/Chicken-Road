name: Chicken Road CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go tests with coverage
        run: go test -race -coverprofile=coverage.out -json ./... | tee test-results.jsonl

      - name: Create coverage report
        if: always()
        run: |
          : > coverage.txt
          if [ -s coverage.out ]; then
            go tool cover -func=coverage.out | tee coverage.txt
            coverage=$(awk '/^total:/ {print $3}' coverage.txt)
            printf '### Backend test coverage\n\nStatement coverage: **%s**\n' "$coverage" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report was produced." | tee coverage.txt
          fi

      - name: Vet Go code
        run: go vet ./...

      - name: Build Go backend
        run: go build ./...

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/test-results.jsonl
            backend/coverage.out
            backend/coverage.txt
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
