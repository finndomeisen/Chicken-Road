name: Chicken Road CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend # Pfad zum Spring Boot Backend anpassen!

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 20
      uses: actions/setup-java@v3
      with:
        java-version: '20'
        distribution: 'temurin'
        cache: maven

    - name: Build and run Tests (inkl. JaCoCo Report)
      run: mvn clean verify

    - name: Upload Test Report (Artifact)
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: jacoco-report
        path: backend/target/site/jacoco/
